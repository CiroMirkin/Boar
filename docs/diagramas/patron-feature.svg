      <rect x="140" y="256" width="690" height="210" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="150" y="260" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="269" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CAPA REPOSITORIO</text>

      <rect x="140" y="476" width="690" height="194" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
