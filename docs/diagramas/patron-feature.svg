<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="patron-title patron-desc">
      <title id="patron-title">Patrón de feature de Capo con repositorio dual</title>
      <desc id="patron-desc">Un componente usa un hook de TanStack Query y casos de uso puros; el hook pide datos a una fábrica de repositorio que elige, según haya sesión, entre el repositorio Next.js (server action a Prisma y PostgreSQL) y el repositorio localStorage (JSON en el navegador).</desc>

